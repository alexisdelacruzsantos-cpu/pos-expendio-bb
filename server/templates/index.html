<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS EXPENDIO BB - Login</title>
    <link rel="icon" type="image/png" href="/static/icons/icon-192.png">
    <link rel="stylesheet" href="/static/css/styles.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0072ce 0%, #d71920 100%);
            margin: 0;
            padding: 20px;
        }
        .login-container {
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
            border-top: 5px solid #ffd100;
        }
        .login-logo {
            text-align: center;
            margin-bottom: 16px;
        }
        .login-logo img {
            max-width: 160px;
            max-height: 120px;
            object-fit: contain;
        }
        .login-title {
            text-align: center;
            color: #1f2937;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .login-subtitle {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 32px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-label {
            display: block;
            color: #374151;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }
        .form-input:focus {
            outline: none;
            border-color: #0072ce;
        }
        .login-button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #0072ce 0%, #0057a8 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 114, 206, 0.35);
        }
        .login-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .login-error {
            background: #fee2e2;
            color: #b91c1c;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
        }
        .autocomplete-wrap {
            position: relative;
        }
        .autocomplete-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            z-index: 100;
            margin: 4px 0 0;
            padding: 4px 0;
            background: white;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.2);
            display: none;
            max-height: 200px;
            overflow-y: auto;
            list-style: none;
        }
        .autocomplete-list.visible {
            display: block;
        }
        .autocomplete-item {
            padding: 10px 16px;
            font-size: 15px;
            color: #374151;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .autocomplete-item.active {
            background: #0072ce;
            color: white;
        }
        .autocomplete-item .hint {
            float: right;
            font-size: 12px;
            color: #6b7280;
        }
        .autocomplete-item.active .hint {
            color: #dbeafe;
        }
        .default-credentials {
            background: #fef3c7;
            padding: 12px;
            border-radius: 8px;
            font-size: 12px;
            color: #92400e;
            margin-top: 20px;
        }
        .default-credentials strong {
            display: block;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-logo"><img src="/static/logoicono.png" alt="Logo Expendio BB"></div>
        <h1 class="login-title">POS EXPENDIO BB</h1>
        <p class="login-subtitle">Pan Bimbo & Productos Barcel</p>
        
        <div id="errorMessage" class="login-error"></div>
        
        <form id="loginForm">
            <div class="form-group">
                <label class="form-label" for="username">Usuario</label>
                <div class="autocomplete-wrap">
                    <input type="text" id="username" class="form-input" placeholder="Usuario" required autocomplete="off" autofocus>
                    <ul id="autocompleteList" class="autocomplete-list"></ul>
                </div>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="password">Contraseña</label>
                <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
            </div>
            
            <button type="submit" id="loginButton" class="login-button">Iniciar Sesión</button>
        </form>
    </div>

    <script>
        // ===== Fullscreen bloqueado desde el login =====
        // El navegador exige un gesto del usuario para entrar a pantalla completa,
        // por eso se intenta al cargar y se reintenta en el primer teclado/clic.
        // ESC no la quita: se previene y, si el navegador (Firefox) igual sale, se reentra.
        (function () {
            // En modo kiosko (firefox -kiosk) NO se usa la Fullscreen API: la ventana
            // ya está en pantalla completa y ESC/F11 no la quitan. Se recuerda para
            // el dashboard. Se activa con ?kiosk=1 y se desactiva con ?kiosk=0.
            var params = new URLSearchParams(window.location.search);
            if (params.get('kiosk') === '1') {
                try { localStorage.setItem('pos_kiosk', '1'); } catch (_) {}
                return;
            }
            if (params.get('kiosk') === '0') {
                try { localStorage.removeItem('pos_kiosk'); } catch (_) {}
            }
            try { if (localStorage.getItem('pos_kiosk') === '1') return; } catch (_) {}

            function isFs() {
                return !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
            }

            function requestFs() {
                if (isFs()) return;
                var el = document.documentElement;
                try {
                    if (el.requestFullscreen) {
                        var r = el.requestFullscreen();
                        if (r && typeof r.catch === 'function') r.catch(function () {});
                    } else if (el.webkitRequestFullscreen) {
                        el.webkitRequestFullscreen();
                    } else if (el.msRequestFullscreen) {
                        el.msRequestFullscreen();
                    }
                } catch (_) {}
            }

            function tryEnter() {
                if (!isFs()) requestFs();
            }

            window.addEventListener('load', function () {
                tryEnter();
                setTimeout(function () { if (!isFs()) tryEnter(); }, 300);
                setTimeout(function () { if (!isFs()) tryEnter(); }, 1000);
            });

            ['keydown', 'click', 'touchstart', 'pointerdown'].forEach(function (ev) {
                document.addEventListener(ev, function () {
                    if (!isFs()) tryEnter();
                }, { capture: true, passive: true });
            });

            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape') {
                    e.preventDefault();
                    e.stopPropagation();
                    if (e.stopImmediatePropagation) e.stopImmediatePropagation();
                    if (typeof closeUserAutocomplete === 'function') closeUserAutocomplete();
                }
            }, { capture: true });
            document.addEventListener('keyup', function (e) {
                if (e.key === 'Escape' && isFs()) {
                    e.preventDefault();
                    e.stopPropagation();
                    if (e.stopImmediatePropagation) e.stopImmediatePropagation();
                }
            }, { capture: true });

            function reenter() {
                if (isFs()) return;
                requestFs();
                setTimeout(function () { if (!isFs()) requestFs(); }, 80);
                setTimeout(function () { if (!isFs()) requestFs(); }, 250);
            }
            document.addEventListener('fullscreenchange', reenter);
            document.addEventListener('webkitfullscreenchange', reenter);
            document.addEventListener('MSFullscreenChange', reenter);
        })();

        window.addEventListener('load', () => {
            const userInput = document.getElementById('username');
            if (userInput && document.activeElement !== userInput) {
                userInput.focus();
                try { userInput.setSelectionRange(userInput.value.length, userInput.value.length); } catch (_) {}
            }
        });

        // ===== Autocompletado de usuario =====
        (function () {
            const userInput = document.getElementById('username');
            const listEl = document.getElementById('autocompleteList');
            let cacheUsers = null;
            let items = [];
            let activeIndex = -1;

            window.closeUserAutocomplete = function () {
                listEl.classList.remove('visible');
                listEl.innerHTML = '';
                items = [];
                activeIndex = -1;
            };

            function render(users) {
                listEl.innerHTML = '';
                items = users;
                activeIndex = items.length ? 0 : -1;
                users.forEach((u, i) => {
                    const li = document.createElement('li');
                    li.className = 'autocomplete-item' + (i === 0 ? ' active' : '');
                    li.textContent = u;
                    li.addEventListener('mousedown', (e) => {
                        e.preventDefault();
                        userInput.value = u;
                        closeUserAutocomplete();
                        document.getElementById('password').focus();
                    });
                    listEl.appendChild(li);
                });
                if (items.length) listEl.classList.add('visible');
                else listEl.classList.remove('visible');
            }

            function showSuggestions(prefix) {
                if (!cacheUsers) return;
                const q = prefix.toLowerCase();
                const matches = cacheUsers.filter(u => u.toLowerCase().includes(q));
                if (matches.length && q.length) render(matches);
                else if (q.length === 0) closeUserAutocomplete();
            }

            function fetchUsers() {
                if (cacheUsers) return;
                fetch('/api/auth/users')
                    .then(r => r.json())
                    .then(data => {
                        cacheUsers = (data.users || []).map(u => u.username || u);
                        showSuggestions(userInput.value);
                    })
                    .catch(() => { cacheUsers = []; });
            }

            userInput.addEventListener('input', () => {
                const v = userInput.value;
                if (v.length === 0) { closeUserAutocomplete(); return; }
                fetchUsers();
                showSuggestions(v);
            });

            userInput.addEventListener('focus', () => {
                if (userInput.value.length >= 1) {
                    fetchUsers();
                    showSuggestions(userInput.value);
                }
            });

            userInput.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowDown') {
                    if (!items.length) { fetchUsers(); showSuggestions(userInput.value); return; }
                    e.preventDefault();
                    activeIndex = (activeIndex + 1) % items.length;
                    updateActive();
                } else if (e.key === 'ArrowUp') {
                    if (!items.length) { fetchUsers(); showSuggestions(userInput.value); return; }
                    e.preventDefault();
                    activeIndex = (activeIndex - 1 + items.length) % items.length;
                    updateActive();
                } else if (e.key === 'Enter') {
                    if (items.length && activeIndex >= 0 && items[activeIndex]) {
                        e.preventDefault();
                        userInput.value = items[activeIndex];
                        closeUserAutocomplete();
                        document.getElementById('password').focus();
                    }
                }
            });

            function updateActive() {
                const children = listEl.children;
                for (let i = 0; i < children.length; i++) {
                    children[i].classList.toggle('active', i === activeIndex);
                }
            }
        })();

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('errorMessage');
            const button = document.getElementById('loginButton');
            
            errorEl.style.display = 'none';
            button.disabled = true;
            button.textContent = 'Iniciando sesión...';
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    localStorage.setItem('pos_token', data.token);
                    localStorage.setItem('pos_user', JSON.stringify(data.user));
                    localStorage.setItem('pos_permissions', JSON.stringify(data.permissions));
                    
                    window.location.href = '/dashboard';
                } else {
                    errorEl.textContent = data.error || 'Error de inicio de sesión';
                    errorEl.style.display = 'block';
                    button.disabled = false;
                    button.textContent = 'Iniciar Sesión';
                }
            } catch (error) {
                errorEl.textContent = 'Error de conexión: ' + error.message;
                errorEl.style.display = 'block';
                button.disabled = false;
                button.textContent = 'Iniciar Sesión';
            }
        });
    </script>
</body>
</html>
